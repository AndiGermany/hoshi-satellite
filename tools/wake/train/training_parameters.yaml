# =============================================================================
# training_parameters.yaml — "Hey Hoshi" microWakeWord-Trainings-Config (TEMPLATE)
# Ticket: T162 · Lane: satellite-hand · Persona: Eda/Yuki
# =============================================================================
#
#   ⚠️  DIES IST EINE PARAMETER-VORLAGE, KEIN AUTO-RUN.
#   Training läuft NICHT auf Andis 16-GB-Mac (RAM-Wand) — sondern auf externer
#   GPU/Colab/Docker. Exakte Schritte: ./TRAIN-RUNBOOK.md.
#
#   Format/Schlüssel verifiziert gegen OHF-Voice/micro-wake-word (vormals
#   kahrendt/microWakeWord) `model_train_eval` + das Referenz-Trainings-Notebook.
#   Die Augmentation-Werte spiegeln README.md §4 (verifiziert 2026-06-13).
#
#   Pfade unten sind RELATIV zum Trainings-Arbeitsverzeichnis auf der GPU-Box.
#   Vor dem Lauf an die dortige Ordnerstruktur anpassen (siehe RUNBOOK Schritt 3).
# =============================================================================

# --- Allgemein / Ausgabe -----------------------------------------------------
train_dir: trained_models/hey_hoshi      # Checkpoints + Export landen hier
clip_duration_ms: 1500                    # Fensterlänge (ms) der Wake-Phrase ("Hey Hoshi" ~0.6–1.0 s + Rand)
window_step_ms: 10                        # MUSS zu feature_step_size im JSON-Manifest passen (10)

# Trainings-Länge: Listen je Phase (mehrere Phasen mit fallender Lernrate).
# MODERAT für ein erstes Eigenmodell; laut Upstream sind mehrere Runden nötig.
training_steps:        [10000, 10000, 10000]
learning_rates:       [0.001, 0.0005, 0.00025]
batch_size:           128
eval_step_interval:   500
positive_class_weight: [1]
negative_class_weight: [20]               # Fehlauslöser TEUER machen (README §5, Referenz 20)

# --- On-Device-Zielwerte (fließen ins JSON-Manifest, im Raum nachjustieren) ---
# Diese steuern die Auswahl der "best_weights" und die Default-Schwelle im Export.
target_minimization: 0.9                  # Ziel-Genauigkeit beim Schwellen-Suchen
minimization_metric: null                 # null = Accuracy; alt.: average_viable_recall
maximization_metric: average_viable_recall

# probability_cutoff / sliding_window_size sind ON-DEVICE-Tuning-Knöpfe (ESPHome).
# Hier als Trainings-/Export-Default; final IM RAUM justieren (README §6).
probability_cutoff:   0.97                # höher → weniger FAR, mehr FRR
sliding_window_size:  5                   # über wie viele Fenster gemittelt wird (mehr → träger/robuster)

# --- Datensätze (Features als Ragged-Mmap; erzeugt in RUNBOOK Schritt 4) ------
# Jeder Eintrag: einer der vorberechneten Spektrogramm-Mmaps + Sampling-Gewicht.
# Positive  = synthetische "Hey Hoshi" (generate-samples.sh) + ECHTE Aufnahmen (Gold!).
# Negative  = generische Sprache/Stille (HF kahrendt/microwakeword) + Hard-Negatives.
features:
  # ---- POSITIVE -------------------------------------------------------------
  - features_dir: features/positives_mmap
    sampling_weight: 1.0
    penalty_weight:  1.0
    truth: true                            # positive Klasse
    truncation_strategy: truncate_start

  # ---- HARD-NEGATIVES (aus hard-negatives.txt synthetisiert + echt) ----------
  - features_dir: features/hard_negatives_mmap
    sampling_weight: 1.0
    penalty_weight:  1.0
    truth: false
    truncation_strategy: truncate_start

  # ---- GENERISCHE NEGATIVE (HF kahrendt/microwakeword: speech/no_speech) -----
  #   → RUNBOOK Schritt 2 lädt speech.zip / no_speech.zip / dinner_party.zip.
  - features_dir: features/generic_negatives_mmap
    sampling_weight: 1.0
    penalty_weight:  1.0
    truth: false
    truncation_strategy: split

# --- Augmentation (auf Clips VOR der Spektrogramm-Berechnung) -----------------
# Deckt alle vier geforderten Achsen ab: Background-Noise, RIR, Gain, Pitch/Tempo.
# (Tempo wird zusätzlich schon bei der Synthese über --length-scales gestreut.)
augmentation:
  augmentation_duration_s: 3.2
  probabilities:
    SevenBandParametricEQ: 0.1
    TanhDistortion:        0.1
    PitchShift:            0.1            # (Pitch)
    BandStopFilter:        0.1
    AddColorNoise:         0.1
    AddBackgroundNoise:    0.75           # (Background) — wichtigster Hebel
    Gain:                  1.0            # (Gain) — immer an
    RIR:                   0.5            # (Room Impulse Response) — Wohnraum-Hall
  # Externe Sets — RUNBOOK Schritt 2 lädt sie (NICHT auf den Mac; GPU-Box):
  impulse_paths:     [mit_rirs]                  # MIT-RIR-Set
  background_paths:  [fma_16k, audioset_16k]     # Background-Audio (16 kHz)
  background_min_snr_db: -5
  background_max_snr_db: 10
  min_jitter_s: 0.195
  max_jitter_s: 0.205

# --- SpecAugment (auf den Spektrogrammen, während des Trainings) -------------
spec_augment:
  enabled: true
  freq_mask_max_size: 7                   # maskierte Frequenz-Bänder
  freq_mask_count:    2
  time_mask_max_size: 10                  # maskierte Zeit-Bänder
  time_mask_count:    2

# --- Modell-Architektur (mixednet, Upstream-Referenz für ESP32-S3) -----------
# Wird per CLI an model_train_eval übergeben; hier als Doku der gewählten Werte.
model:
  type: mixednet
  pointwise_filters: "64,64,64,64"
  stride: 3
  # Export: gestreamtes, intern-quantisiertes TFLite (ESPHome-tauglich).
  # tensor_arena_size wird beim Export bestimmt → ins JSON-Manifest übernehmen
  # (Referenz okay_nabu: 26080; eigenes Modell kann abweichen).
